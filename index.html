<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>광주화정유소년야구단 대시보드</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="gov" id="gov" onclick="closeGame(event)">
  <div class="gpop" id="gpop" onclick="event.stopPropagation()">
    <div class="gph"><h3 id="gpTitle"></h3><button class="xbtn" onclick="closeGame()">✕</button></div>
    <div class="gpb" id="gpBody"></div>
  </div>
</div>
<div class="plov" id="plov" onclick="closePl()">
  <div class="plpop" onclick="event.stopPropagation()">
    <div class="mhd"><div class="mav" id="mAv"></div><div><div class="mname" id="mName"></div><div class="mnum" id="mNum"></div></div></div>
    <div class="mrows" id="mRows"></div>
    <button class="mcls" onclick="closePl()">닫기</button>
  </div>
</div>
<div class="vpov" id="vpov" onclick="closeVp()">
  <div class="vppop" onclick="event.stopPropagation()">
    <div class="mhd"><span style="font-size:26px">🏟️</span><div class="mname" id="vpName"></div></div>
    <div style="border-top:.5px solid var(--br);padding-top:10px;">
      <div style="font-size:13px;color:var(--t2);margin-bottom:12px;line-height:1.7;" id="vpAddr"></div>
      <div style="font-size:11px;color:var(--t2);margin-bottom:6px;font-weight:600;">배정 경기</div>
      <div class="vptags" id="vpGames"></div>
      <a class="nbtn" id="vpLink" href="#" target="_blank">📍 네이버 지도로 찾아가기</a>
      <button class="mcls" onclick="closeVp()">닫기</button>
    </div>
  </div>
</div>
<div class="galov" id="galov">
  <div class="galhd"><span id="galTitle"></span><button class="xbtn" onclick="closeGal()">✕</button></div>
  <div class="galbody" id="galBody"></div>
</div>
<div class="wrap" id="mainWrap">
  <div class="hdr">
    <svg class="logo-svg" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
      <path d="M28 3 L50 12 L50 32 Q50 46 28 53 Q6 46 6 32 L6 12 Z" fill="#2b1216" stroke="#c8a84b" stroke-width="1.5"/>
      <path d="M28 7 L46 15 L46 32 Q46 43 28 49 Q10 43 10 32 L10 15 Z" fill="#1c0a0d"/>
      <text x="13" y="33" font-family="Arial Black,sans-serif" font-weight="900" font-size="18" fill="#c8a84b" letter-spacing="-1">H</text>
      <text x="29" y="33" font-family="Arial Black,sans-serif" font-weight="900" font-size="18" fill="#ffffff" letter-spacing="-1">J</text>
      <ellipse cx="28" cy="22" rx="5" ry="3.5" fill="#f5a623"/>
      <ellipse cx="28" cy="22" rx="2" ry="3" fill="#1a1a1a"/>
      <circle cx="27" cy="21" r="0.8" fill="#fff"/>
      <rect x="10" y="37" width="36" height="8" rx="2" fill="#c8a84b"/>
      <text x="28" y="43.5" font-family="Arial,sans-serif" font-weight="700" font-size="5.5" fill="#2b1216" text-anchor="middle" letter-spacing="0.5">TIGERS</text>
      <circle cx="28" cy="51" r="3" fill="#fff" stroke="#ccc" stroke-width=".5"/>
    </svg>
    <div>
      <h1 id="hdrTitle">불러오는 중…</h1>
      <p>광주화정유소년야구단 · 화정 경기 대시보드</p>
    </div>
  </div>
  <div class="notice"><span>⚠️</span><div id="noticeBox"></div></div>
  <div class="search-bar">
    <input type="text" id="playerSearch" placeholder="선수 이름 검색 (선수 정보 조회)"
           onkeydown="if(event.key==='Enter') doSearch()" autocomplete="off">
    <button type="button" class="btn-confirm" onclick="doSearch()">확인</button>
    <button type="button" class="btn-reset" onclick="clearSearch()">초기화</button>
  </div>
  <div class="search-note">※ 경기 카드를 누르면 수비 라인업이 표시됩니다. 선수 검색 시 해당 선수 출전 경기만 표시됩니다.</div>
  <div class="stats" id="stats"></div>
  <div class="sec">화정 경기 일정</div>
  <div class="search-info" id="searchInfo"></div>
  <div id="searchCand"></div>
  <div class="filters" id="filters"></div>
  <div id="bulkbar"></div>
  <div id="glist"></div>
  <div class="sec" style="margin-top:1.5rem">경기장 안내</div>
  <div class="vrow" id="venues"></div>
  <div class="updated" id="updated"></div>
</div>
<script src="assets/app.js"></script>
</body>
</html>
