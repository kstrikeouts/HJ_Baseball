<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>화정유소년야구단 - 영암월출산배 대시보드</title>
<style>
  :root{
    --main:#7a1f2b;--mid:#b0413e;--light:#fbeeea;--border:#e6b8ae;--field:#2b1216;--txt:#7a1f2b;
    --bg:#fff;--bg2:#faf6f4;--tx:#1a1a1a;--t2:#6b7280;--br:#e5e7eb;--b2:#d1d5db;
    --rs:6px;--rm:10px;--rl:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:var(--bg2);color:var(--tx);min-height:100vh;}
  .wrap{max-width:640px;margin:0 auto;padding:1rem;}
  .hdr{border-radius:var(--rl);padding:1.1rem 1.25rem;margin-bottom:.75rem;display:flex;align-items:center;gap:14px;background:var(--main);box-shadow:0 2px 10px rgba(122,31,43,.35);}
  .logo-svg{width:56px;height:56px;flex-shrink:0;}
  .hdr h1{font-size:17px;font-weight:700;color:#fff;margin-bottom:3px;}
  .hdr p{font-size:12px;color:rgba(255,255,255,.78);}
  .notice{background:#fff8e1;border:1px solid #ffcc02;border-radius:var(--rm);padding:.7rem .9rem;margin-bottom:1rem;font-size:12.5px;color:#7a4e00;line-height:1.5;display:flex;gap:8px;align-items:flex-start;}
  .notice b{font-weight:700;}
  .agenda{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;}
  .agenda .abadge{flex:1;min-width:150px;background:var(--light);border:1px solid var(--border);border-radius:var(--rm);padding:.6rem .8rem;font-size:12px;color:var(--txt);font-weight:600;}
  .agenda .abadge span{display:block;font-size:11px;font-weight:500;color:#9a5a52;margin-top:2px;}
  .search-bar{display:flex;gap:8px;margin-bottom:.6rem;align-items:center;}
  .search-bar input{
    flex:1;padding:12px 14px;border-radius:var(--rm);border:1.5px solid var(--br);
    font-size:16px;background:var(--bg);outline:none;transition:border-color .2s;font-family:inherit;
  }
  .search-bar input:focus{border-color:var(--main);}
  .search-bar button{padding:12px 16px;border-radius:var(--rm);border:none;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;}
  .btn-confirm{background:var(--main);color:#fff;}
  .btn-confirm:hover{opacity:.9;}
  .btn-reset{background:var(--bg);color:var(--t2);border:1.5px solid var(--b2) !important;}
  .btn-reset:hover{background:#f3f4f6;}
  .search-note{font-size:11px;color:var(--t2);margin-bottom:1rem;}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem;}
  .stat{background:var(--bg);border-radius:var(--rm);padding:.8rem .5rem;text-align:center;border:.5px solid var(--br);}
  .stat .n{font-size:22px;font-weight:700;color:var(--mid);}
  .stat .l{font-size:11px;color:var(--t2);margin-top:2px;}
  .sec{font-size:11px;font-weight:600;color:var(--t2);margin-bottom:8px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.06em;}
  .sec::before{content:'';width:3px;height:13px;border-radius:2px;background:var(--mid);}
  .vrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem;}
  .vcard{background:var(--bg);border:.5px solid var(--br);border-radius:var(--rl);padding:.85rem 1rem;cursor:pointer;display:flex;align-items:center;gap:10px;transition:border-color .15s;}
  .vcard:hover{border-color:var(--mid);}
  .vc-name{font-size:13px;font-weight:600;color:var(--tx);}
  .vc-addr{font-size:11px;color:var(--t2);margin-top:2px;line-height:1.4;}
  .vc-link{font-size:11px;margin-top:4px;font-weight:500;color:var(--mid);}
  .filters{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap;}
  .fbtn{padding:5px 14px;border-radius:999px;font-size:13px;cursor:pointer;border:.5px solid var(--b2);background:var(--bg);color:var(--t2);font-weight:500;}
  .fbtn.on{background:var(--main);color:#fbeeea;border-color:var(--main);}
  .dlbl{font-size:12px;font-weight:600;border-radius:var(--rs);padding:4px 12px;display:inline-block;margin-bottom:8px;color:var(--txt);background:var(--light);border:.5px solid var(--border);}
  .gcards{display:flex;flex-direction:column;gap:10px;margin-bottom:1.25rem;}
  .gcard{border-radius:var(--rl);padding:.9rem 1rem;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:transform .12s, box-shadow .15s;background:#fdf3f0;border:2px solid var(--border);border-left:7px solid var(--main);}
  .gcard:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(122,31,43,.2);}
  .gtop{display:flex;align-items:center;gap:8px;}
  .gm{font-size:15px;font-weight:700;color:var(--tx);line-height:1.3;}
  .gm .vs{font-weight:600;margin:0 2px;color:#666;}
  .gm .hj{color:var(--main);}
  .gvenue{margin:-2px 0 2px 0;}
  .gvenue .vlink{font-size:12px;color:#555;text-decoration:none;font-weight:500;display:inline-flex;align-items:center;gap:3px;}
  .gvenue .vlink:hover{text-decoration:underline;}
  .gbot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .tbadge{text-align:center;border-radius:var(--rs);padding:3px 9px;flex-shrink:0;background:rgba(255,255,255,.7);border:.5px solid rgba(0,0,0,.08);}
  .tbadge span{font-size:11px;font-weight:600;white-space:nowrap;color:#333;}
  .spacer{flex:1;}
  .cb{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;flex-shrink:0;}
  .c유소년{background:#e3f2fd;color:#0d47a1;border:.5px solid #90caf9;}
  .c꿈나무{background:#fff8e1;color:#e65100;border:.5px solid #ffcc02;}
  .c새싹{background:#e8f5e9;color:#1b5e20;border:.5px solid #81c784;}
  .sb{font-size:11px;padding:3px 8px;border-radius:999px;font-weight:500;flex-shrink:0;}
  .home{background:#e8f5e9;color:#2e7d32;border:.5px solid #81c784;}
  .away{background:#fce4ec;color:#880e4f;border:.5px solid #f48fb1;}
  .wx{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:500;background:rgba(255,255,255,.75);border:.5px solid rgba(0,0,0,.08);border-radius:var(--rs);padding:3px 8px;color:#0369a1;white-space:nowrap;flex-shrink:0;}
  .wx.rain{background:#fef3c7;border-color:#fcd34d;color:#92400e;}
  .wx.cloud{background:#f3f4f6;border-color:var(--b2);color:#374151;}
  .wx.load{background:#f9fafb;border-color:var(--br);color:#9ca3af;}
  .cand-box{background:var(--bg);border:1.5px solid var(--br);border-radius:var(--rl);padding:1rem 1.1rem;margin-bottom:1rem;}
  .cand-title{font-size:13px;font-weight:600;color:var(--t2);margin-bottom:10px;}
  .cand-list{display:flex;flex-direction:column;gap:8px;}
  .cand-btn{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:var(--rm);border:1.5px solid var(--br);background:var(--bg);cursor:pointer;font-size:15px;font-weight:600;color:var(--tx);transition:all .15s;font-family:inherit;}
  .cand-btn:hover{border-color:var(--mid);background:#fdf3f0;}
  .cand-num{font-size:13px;font-weight:700;color:#7a1f2b;background:#fbeeea;padding:3px 10px;border-radius:999px;}
  .gov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:800;align-items:flex-end;justify-content:center;}
  .gov.open{display:flex;}
  .gpop{background:var(--bg);border-radius:var(--rl) var(--rl) 0 0;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;box-shadow:0 -4px 32px rgba(0,0,0,.25);animation:slideUp .25s ease;}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .gph{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem .85rem;border-bottom:.5px solid var(--br);position:sticky;top:0;background:var(--bg);z-index:1;}
  .gph h3{font-size:14px;font-weight:700;color:var(--tx);}
  .xbtn{width:32px;height:32px;border-radius:50%;border:none;background:var(--bg2);cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;color:var(--t2);}
  .gpb{padding:1rem 1.25rem 1.5rem;}
  .vsbox{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--rm);margin-bottom:12px;background:var(--light);border:.5px solid var(--border);}
  .vst{flex:1;text-align:center;}
  .vn{font-size:15px;font-weight:700;color:var(--txt);}
  .vn.hw{color:#a3322f !important;}
  .vr{font-size:11px;color:var(--t2);margin-top:2px;}
  .vsep{font-size:18px;font-weight:700;color:var(--b2);}
  .meta{font-size:12px;color:var(--t2);margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .mlink{text-decoration:underline;cursor:pointer;font-weight:500;color:var(--mid);}
  .field{border-radius:var(--rl);padding:1rem .5rem;box-shadow:inset 0 2px 8px rgba(0,0,0,.2);background:var(--field);}
  .ftitle{font-size:11px;text-align:center;margin-bottom:8px;color:rgba(255,255,255,.6);}
  .diamond{position:relative;width:100%;max-width:380px;height:340px;margin:0 auto;}
  .diamond svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
  .pnode{position:absolute;transform:translate(-50%,-50%);background:#f5f5dc;border:1.5px solid #8B6914;border-radius:var(--rs);padding:4px 8px;min-width:62px;text-align:center;cursor:pointer;transition:transform .12s;z-index:2;}
  .pnode:hover{transform:translate(-50%,-50%) scale(1.1);background:#fffde7;}
  .pnode.pitcher{background:#fff9c4;border-color:#f9a825;}
  .pnode.catcher{background:#e3f2fd;border-color:#1565c0;}
  .pnode.extra{background:#f3e5f5;border-color:#8e24aa;}
  .pname{font-size:12px;font-weight:600;color:#1a1a1a;}
  .ppos{font-size:9px;color:#666;margin-top:1px;}
  .lineup-pending{border-radius:var(--rl);padding:2.2rem 1rem;text-align:center;background:var(--bg2);border:1.5px dashed var(--b2);color:var(--t2);font-size:13px;line-height:1.6;}
  .plov,.vpov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1100;align-items:center;justify-content:center;padding:1rem;}
  .plov.open,.vpov.open{display:flex;}
  .plpop{background:var(--bg);border-radius:var(--rl);padding:1.25rem;width:260px;box-shadow:0 8px 40px rgba(0,0,0,.35);}
  .vppop{background:var(--bg);border-radius:var(--rl);padding:1.25rem;width:300px;box-shadow:0 8px 32px rgba(0,0,0,.25);}
  .mhd{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .mav{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0;background:#f1f5f9;color:#334155;border:2px solid var(--b2);}
  .mname{font-size:16px;font-weight:700;color:var(--tx);}
  .mnum{font-size:13px;color:var(--t2);margin-top:2px;}
  .mrows{border-top:.5px solid var(--br);padding-top:10px;}
  .mrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:.5px solid var(--br);font-size:13px;}
  .mrow:last-child{border-bottom:none;}
  .ml{color:var(--t2);} .mv{color:var(--tx);font-weight:600;}
  .mcls{display:block;width:100%;margin-top:14px;padding:9px;text-align:center;cursor:pointer;color:#fff;border-radius:var(--rm);border:none;font-size:13px;font-weight:600;background:#334155;}
  .vptags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;}
  .vptag{font-size:11px;padding:3px 9px;border-radius:999px;background:#f1f5f9;color:#334155;border:.5px solid var(--b2);}
  .nbtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border-radius:var(--rm);background:#03C75A;color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px;text-decoration:none;}
  .empty-msg{text-align:center;padding:2.5rem 1rem;color:var(--t2);font-size:14px;line-height:1.6;}
  .search-info{font-size:12px;color:var(--t2);margin-bottom:10px;padding:6px 12px;background:#f1f5f9;border-radius:var(--rs);display:none;}
  .search-info.show{display:block;}
  @media(max-width:400px){.stats{grid-template-columns:repeat(2,1fr);}.vrow{grid-template-columns:1fr;}}
</style>
</head>

</div>

</div>

</div>

  <div class="search-info" id="searchInfo"></div>
  <div id="searchCand"></div>
  <div class="filters" id="filters"></div>
  <div id="glist"></div>
  <div class="sec" style="margin-top:1.5rem">경기장 안내</div>
  <div class="vrow" id="venues"></div>
</div>

let filt='전체', wxCache={}, sel=null;
function closeGame(e){if(e&&e.target!==document.getElementById('gov'))return;document.getElementById('gov').classList.remove('open');}
function closePl(){document.getElementById('plov').classList.remove('open');}
function closeVp(){document.getElementById('vpov').classList.remove('open');}
function openVp(name,e){
  if(e)e.stopPropagation();
  const v=T.venues[name];if(!v)return;
  document.getElementById('vpName').textContent=name;
  document.getElementById('vpAddr').textContent=v.addr;
  document.getElementById('vpGames').innerHTML=v.games.map(g=>`<span class="vptag">${g}</span>`).join('');
  const lk=document.getElementById('vpLink');
  if(v.url){lk.href=v.url;lk.style.display='flex';}else{lk.style.display='none';}
  document.getElementById('vpov').classList.add('open');
}
function showPl(key,posLabel){
  const p=ROSTER[key];
  const disp=key.replace(/\(\d+\)$/,'');
  document.getElementById('mAv').textContent=disp.slice(0,1);
  document.getElementById('mName').textContent=disp;
  document.getElementById('mNum').textContent=(p&&p.num)?`#${p.num}${posLabel?' · '+posLabel:''}`:(posLabel||'');
  const rows=[];
  if(p&&p.num)rows.push({l:'등번호',v:`#${p.num}`});
  if(p&&p.school)rows.push({l:'출신학교',v:p.school});
  if(p&&p.birth)rows.push({l:'생년월일',v:p.birth});
  if(rows.length===0)rows.push({l:'정보',v:'등록된 정보 없음'});
  document.getElementById('mRows').innerHTML=rows.map(r=>`<div class="mrow"><span class="ml">${r.l}</span><span class="mv">${r.v}</span></div>`).join('');
  document.getElementById('plov').classList.add('open');
}
function wxInfo(code,temp){
  if(code<=1) return{icon:'☀️',label:`맑음 ${temp}°`,cls:''};
  if(code<=3) return{icon:'⛅',label:`구름 ${temp}°`,cls:'cloud'};
  if(code<=48)return{icon:'🌫️',label:`안개 ${temp}°`,cls:'cloud'};
  if(code<=67)return{icon:'🌧️',label:`비 ${temp}°`,cls:'rain'};
  if(code<=77)return{icon:'❄️',label:`눈 ${temp}°`,cls:'cloud'};
  if(code<=82)return{icon:'🌦️',label:`소나기 ${temp}°`,cls:'rain'};
  return{icon:'⛈️',label:`뇌우 ${temp}°`,cls:'rain'};
}
async function fetchWeather(){
  try{
    const today=new Date(); today.setHours(0,0,0,0);
    const lastDate=Object.values(T.dates).sort().pop();
    const target=new Date(lastDate);
    const diff=Math.ceil((target-today)/(1000*60*60*24));
    const fdays=Math.max(Math.min(diff+1,16),1);
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${T.lat}&longitude=${T.lon}&hourly=temperature_2m,weather_code&timezone=Asia%2FSeoul&forecast_days=${fdays}`;
    const r=await fetch(url);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(!d.hourly||!d.hourly.time) throw new Error('no data');
    const times=d.hourly.time, temps=d.hourly.temperature_2m, codes=d.hourly.weather_code||d.hourly.weathercode;
    T.games.forEach(g=>{
      const ds=T.dates[g.date];
      const key=`${ds}T${String(g.hour).padStart(2,'0')}:00`;
      const idx=times.indexOf(key);
      if(idx>=0) wxCache[g.id]={code:codes[idx],temp:Math.round(temps[idx])};
    });
    applyWx();
  }catch(e){
    console.warn('날씨 오류:',e.message);
    T.games.forEach(g=>{
      const el=document.getElementById('wx'+g.id);
      if(el){el.className='wx cloud';el.textContent='날씨 준비중';}
    });
  }
}
function applyWx(){
  document.querySelectorAll('[id^="wx"]').forEach(el=>{
    const id = el.id.replace('wx','');
    const w = wxCache[id];
    if(!w) return;
    const{icon,label,cls}=wxInfo(w.code,w.temp);
    el.className='wx '+cls; el.textContent=`${icon} ${label}`;
  });
}
function playerGames(key){
  return T.games.filter(g=>Object.values(T.lineups[g.id]||{}).includes(key));
}
function selectPlayer(key){
  sel = key;
  const disp = key.replace(/\(\d+\)$/,'');
  const gs = playerGames(key);
  const infoEl = document.getElementById('searchInfo');
  document.getElementById('searchCand').innerHTML='';
  infoEl.className='search-info show';
  infoEl.innerHTML = gs.length
    ? `<b>${disp}</b> 선수 출전 경기 ${gs.length}건만 표시 중 · <span class="mlink" onclick="showPl('${key}','')">선수 정보 보기</span>`
    : `<b>${disp}</b> 선수가 배정된 경기가 없습니다 · <span class="mlink" onclick="showPl('${key}','')">선수 정보 보기</span>`;
  renderGames();
}
function doSearch(){
  const term = document.getElementById('playerSearch').value.trim();
  const infoEl = document.getElementById('searchInfo');
  const candEl = document.getElementById('searchCand');
  candEl.innerHTML='';
  if(!term){ clearSearch(); return; }
  const matches = Object.keys(ROSTER).filter(n=>n.replace(/\(\d+\)$/,'').includes(term)).sort();
  if(matches.length===0){
    sel=null; renderGames();
    infoEl.className='search-info show'; infoEl.textContent=`"${term}" 검색 결과 없음`;
  } else if(matches.length===1){
    selectPlayer(matches[0]);
  } else {
    sel=null; renderGames();
    infoEl.className='search-info show';
    infoEl.textContent=`"${term}" 검색 · 동명이인 ${matches.length}명 — 선수를 선택하세요`;
    candEl.innerHTML = `
      <div class="cand-box">
        <div class="cand-title">아래에서 선수를 선택하세요</div>
        <div class="cand-list">
          ${matches.map(name=>{
            const p = ROSTER[name] || {};
            const num = p.num ? `#${p.num}` : '';
            const cnt = playerGames(name).length;
            return `<button class="cand-btn" onclick="selectPlayer('${name}')"><span>${name.replace(/\(\d+\)$/,'')} <span style="font-size:12px;color:#6b7280;font-weight:500">${cnt}경기</span></span><span class="cand-num">${num}</span></button>`;
          }).join('')}
        </div>
      </div>`;
  }
}
function clearSearch(){
  sel=null;
  document.getElementById('playerSearch').value='';
  document.getElementById('searchInfo').className='search-info';
  document.getElementById('searchInfo').innerHTML='';
  document.getElementById('searchCand').innerHTML='';
  renderGames();
}
function renderAll(){
  const days=[...new Set(T.games.map(g=>g.date))].length;
  const cats=[...new Set(T.games.map(g=>g.cat))].length;
  const venues=Object.keys(T.venues).length;
  document.getElementById('stats').innerHTML=[
    {n:T.games.length,l:'화정 경기 수'},{n:days,l:'경기 일수'},{n:cats,l:'참가 부문'},{n:venues,l:'경기장 수'}
  ].map(s=>`<div class="stat"><div class="n">${s.n}</div><div class="l">${s.l}</div></div>`).join('');
  document.getElementById('venues').innerHTML=Object.entries(T.venues).map(([name,v])=>`
    <div class="vcard" onclick="openVp('${name}',event)">
      <span style="font-size:22px">🏟️</span>
      <div><div class="vc-name">${name}</div><div class="vc-addr">${v.addr}</div><div class="vc-link">${v.url?'📍 지도 보기':'🕓 주소 준비중'}</div></div>
    </div>`).join('');
  renderFilters();
  renderGames();
  fetchWeather();
}
function renderFilters(){
  document.getElementById('filters').innerHTML=T.cats.map(f=>
    `<button class="fbtn ${filt===f?'on':''}" onclick="setFilt('${f}')">${f}</button>`).join('');
}
function setFilt(f){filt=f;renderFilters();renderGames();}
function renderGames(){
  let filtered = filt==='전체' ? T.games : T.games.filter(g=>g.cat===filt);
  if(sel) filtered = filtered.filter(g=>Object.values(T.lineups[g.id]||{}).includes(sel));
  if(filtered.length===0){
    const msg = sel
      ? `${sel.replace(/\(\d+\)$/,'')} 선수의 해당 조건 경기가 없습니다.<br><span class="mlink" onclick="clearSearch()">전체 경기 보기</span>`
      : '해당 부문 경기가 없습니다.';
    document.getElementById('glist').innerHTML = `<div class="empty-msg">${msg}</div>`;
    return;
  }
  const byDate = {};
  filtered.forEach(g=>{ if(!byDate[g.date]) byDate[g.date]=[]; byDate[g.date].push(g); });
  document.getElementById('glist').innerHTML = Object.entries(byDate).map(([date,gs])=>`
    <div class="dlbl">📅 ${date}(${gs[0].dow}요일)</div>
    <div class="gcards">${gs.map(g=>{
      const isH = g.right==='화정';
      const vurl = T.venues[g.venue]?.url || '#';
      let posTag='';
      if(sel){
        const lu=T.lineups[g.id]||{};
        const pk=Object.keys(lu).find(k=>lu[k]===sel);
        const pl=POS.find(p=>p.key===pk);
        if(pl) posTag=`<span class="sb" style="background:#e0f2fe;color:#075985;border:.5px solid #7dd3fc">${pl.label||'EH'}</span>`;
      }
      return`<div class="gcard" onclick="openGame('${g.id}')">
        <div class="gtop">
          <div class="gm">${g.left==='화정'?'<span class="hj">화정</span>':g.left}<span class="vs"> vs </span>${g.right==='화정'?'<span class="hj">화정</span>':g.right}</div>
        </div>
        <div class="gvenue">
          <a class="vlink" href="#" onclick="openVp('${g.venue}',event);return false;">📍 ${g.venue}</a>
        </div>
        <div class="gbot">
          <div class="tbadge"><span>${g.time}</span></div>
          <span class="spacer"></span>
          <span id="wx${g.id}" class="wx load">⏳</span>
          ${posTag}
          <span class="sb ${isH?'home':'away'}">${isH?'홈':'원정'}</span>
          <span class="cb c${g.cat}">${g.cat}</span>
        </div>
      </div>`;
    }).join('')}</div>`).join('');
  applyWx();
}
function openGame(id){
  const g = T.games.find(x=>x.id===id); if(!g) return;
  const lu = T.lineups[g.id] || {};
  const hasLineup = Object.values(lu).some(v=>v);
  const vurl = T.venues[g.venue]?.url || '#';
  let fieldHtml;
  if(hasLineup){
    const nodes = POS.filter(p=>!(p.key==='EH'&&!lu[p.key])).map(p=>{
      const key = lu[p.key] || '';
      const disp = key.replace(/\(\d+\)$/,'');
      const num = ROSTER[key] && ROSTER[key].num ? `#${ROSTER[key].num}` : '';
      return`<div class="pnode ${p.cls}" style="left:${p.x}%;top:${p.y}%" onclick="showPl('${key}','${p.label}')">
        <div class="pname">${disp}${num?`<span style="font-size:9px;color:#777;font-weight:500"> ${num}</span>`:''}</div><div class="ppos">${p.label}</div></div>`;
    }).join('');
    fieldHtml = `
      <div class="field">
        <div class="ftitle">수비 라인업 — 선수 이름을 클릭하면 상세 정보를 볼 수 있습니다</div>
        <div class="diamond">
          <svg viewBox="0 0 380 340" xmlns="http://www.w3.org/2000/svg">
            <line x1="53" y1="75" x2="190" y2="296" stroke="#999" stroke-width="1" opacity=".4"/>
            <line x1="327" y1="75" x2="190" y2="296" stroke="#999" stroke-width="1" opacity=".4"/>
            <path d="M53 75 Q190 10 327 75" fill="none" stroke="#999" stroke-width="1" opacity=".3"/>
            <polygon points="190,150 120,210 190,265 260,210" fill="rgba(210,166,121,.18)" stroke="#c8a84b" stroke-width="1.5"/>
          </svg>
          ${nodes}
        </div>
      </div>`;
  } else {
    fieldHtml = `<div class="lineup-pending">📋 라인업은 추후 업데이트 예정입니다.<br>확정되는 대로 이 화면에 표시됩니다.</div>`;
  }
  document.getElementById('gpTitle').textContent = `⚾ ${g.date}(${g.dow}) ${g.time} · ${g.cat}`;
  document.getElementById('gpBody').innerHTML = `
    <div class="vsbox">
      <div class="vst"><div class="vn ${g.left==='화정'?'hw':''}">${g.left}</div><div class="vr">원정</div></div>
      <div class="vsep">:</div>
      <div class="vst"><div class="vn ${g.right==='화정'?'hw':''}">${g.right}</div><div class="vr">홈</div></div>
    </div>
    <div class="meta">
      <span class="mlink" onclick="openVp('${g.venue}',event)">📍 ${g.venue}</span>
      <span>·</span><span>화정 ${g.right==='화정'?'홈':'원정'}</span>
      ${T.coaches[g.cat]?`<span>·</span><span>👤 ${T.coaches[g.cat]}</span>`:''}
    </div>
    ${fieldHtml}`;
  document.getElementById('gov').classList.add('open');
}
renderAll();
